<svg xmlns="http://www.w3.org/2000/svg" viewBox="270 95 360 360" width="100%" height="100%">
  <defs>
    <radialGradient id="favHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FF5C9D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="favInfinityPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="30%" stop-color="#F50057"/>
      <stop offset="70%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>

    <linearGradient id="favChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D81B60" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Pink Glow -->
  <circle cx="450" cy="275" r="160" fill="url(#favHalo)"/>

  <!-- Dial Rings -->
  <g opacity="0.35" stroke="#F48FB1" fill="none">
    <circle cx="450" cy="275" r="145" stroke-width="1.5" stroke-dasharray="6 8"/>
    <circle cx="450" cy="275" r="165" stroke-width="1.8" stroke-dasharray="60 15 10 15"/>
  </g>

  <!-- Stethoscope Infinity Emblem -->
  <g filter="url(#favGlow)">
    <circle cx="395" cy="110" r="7.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="3.5"/>
    <circle cx="505" cy="110" r="7.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="3.5"/>

    <path d="M 395 117.5 C 395 155, 424 173, 450 179 C 476 173, 505 155, 505 117.5" 
          fill="none" stroke="url(#favChrome)" stroke-width="5.5" stroke-linecap="round"/>

    <rect x="446" y="176" width="8" height="12" rx="2" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>

    <path d="M 450 188 L 450 200" fill="none" stroke="url(#favInfinityPink)" stroke-width="9" stroke-linecap="round"/>

    <path d="M 450 188
             C 410 188, 310 210, 310 290
             C 310 360, 410 390, 450 285
             C 485 195, 590 225, 590 290
             C 590 350, 525 380, 475 380" 
          fill="none" stroke="url(#favInfinityPink)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 475 380
             C 440 380, 420 370, 400 350
             C 385 335, 380 315, 395 300
             C 410 285, 435 285, 450 285" 
          fill="none" stroke="url(#favInfinityPink)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="140 10"/>

    <!-- Pulse ECG -->
    <path d="M 285 290 L 345 290 L 360 265 L 375 315 L 395 240 L 415 340 L 430 275 L 445 303 L 458 290 L 615 290" 
          fill="none" stroke="#4A148C" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 590 290 C 610 325, 605 375, 565 410 C 535 435, 480 435, 440 430 L 380 430" 
          fill="none" stroke="url(#favInfinityPink)" stroke-width="8" stroke-linecap="round"/>

    <g transform="translate(365, 430)">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#E91E63" stroke-width="2.8" stroke-dasharray="10 4"/>
      <circle cx="0" cy="0" r="20" fill="#FFFFFF" stroke="url(#favChrome)" stroke-width="4"/>
      <circle cx="0" cy="0" r="10" fill="#F06292"/>
      <circle cx="0" cy="0" r="5" fill="#AD1457"/>
    </g>

    <g fill="#FFFFFF">
      <circle cx="450" cy="188" r="3"/>
      <circle cx="310" cy="290" r="3"/>
      <circle cx="590" cy="290" r="3"/>
      <path d="M 450 275 Q 450 285 460 285 Q 450 285 450 295 Q 450 285 440 285 Q 450 285 450 275 Z" fill="#FFFFFF" opacity="0.95"/>
    </g>
  </g>
</svg>