<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <defs>
    <!-- Crisp White/Soft Rose Light Mode Canvas Background -->
    <radialGradient id="lightBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFF8FA"/>
      <stop offset="100%" stop-color="#FFF0F5"/>
    </radialGradient>

    <!-- Soft Ambient Pink Halo Behind Emblem -->
    <radialGradient id="pinkHalo" cx="50%" cy="40%" r="48%">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.14"/>
      <stop offset="55%" stop-color="#FF5C9D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter for Light Mode Elements -->
    <filter id="lightGlowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#D81B60" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF2A85" flood-opacity="0.22"/>
    </filter>

    <!-- Vibrant Gradient for the Main Stethoscope Infinity Ribbon -->
    <linearGradient id="lightInfinityPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="30%" stop-color="#F50057"/>
      <stop offset="70%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#C2185B"/>
    </linearGradient>

    <!-- Metallic Rose-Chrome Gradient for Headset & Bell Details -->
    <linearGradient id="lightChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8BBD0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F48FB1"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>

    <!-- Gradient for Brand Name in Light Mode -->
    <linearGradient id="brandTextLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2185B"/>
      <stop offset="50%" stop-color="#E91E63"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#lightBg)"/>

  <!-- Diffuse Pink Center Aura -->
  <circle cx="450" cy="285" r="270" fill="url(#pinkHalo)"/>

  <!-- Clean Minimal Tech Dial Rings -->
  <g opacity="0.32" stroke="#F48FB1" fill="none">
    <circle cx="450" cy="285" r="185" stroke-width="1.2" stroke-dasharray="6 8"/>
    <circle cx="450" cy="285" r="225" stroke-width="1.6" stroke-dasharray="90 20 12 20"/>
    <circle cx="450" cy="285" r="240" stroke-width="0.75"/>
    <circle cx="450" cy="285" r="255" stroke-width="1.4" stroke-dasharray="12 12"/>
  </g>

  <!-- Main Emblem with Drop Shadow -->
  <g filter="url(#lightGlowShadow)">

    <!-- Stethoscope Binaural Earpieces -->
    <circle cx="395" cy="110" r="7.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="3.5"/>
    <circle cx="505" cy="110" r="7.5" fill="#FFFFFF" stroke="#C2185B" stroke-width="3.5"/>

    <!-- Headset Metallic Arms -->
    <path d="M 395 117.5 
             C 395 155, 424 173, 450 179 
             C 476 173, 505 155, 505 117.5" 
          fill="none" 
          stroke="url(#lightChrome)" 
          stroke-width="5" 
          stroke-linecap="round"/>

    <!-- Connector Joint -->
    <rect x="446" y="176" width="8" height="12" rx="2" fill="#FFFFFF" stroke="#C2185B" stroke-width="2"/>

    <!-- Lead Tube connecting stem to Ribbon Loop -->
    <path d="M 450 188 L 450 200" 
          fill="none" 
          stroke="url(#lightInfinityPink)" 
          stroke-width="8" 
          stroke-linecap="round"/>

    <!-- Ribbon Strand A: Sweeps Left across the Kinetic Infinity Loop -->
    <path d="M 450 188
             C 410 188, 310 210, 310 290
             C 310 360, 410 390, 450 285
             C 485 195, 590 225, 590 290
             C 590 350, 525 380, 475 380" 
          fill="none" 
          stroke="url(#lightInfinityPink)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Ribbon Strand B: Lower loop continuation -->
    <path d="M 475 380
             C 440 380, 420 370, 400 350
             C 385 335, 380 315, 395 300
             C 410 285, 435 285, 450 285" 
          fill="none" 
          stroke="url(#lightInfinityPink)" 
          stroke-width="10" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          stroke-dasharray="140 10"/>

    <!-- Pulse / Lifeline ECG Accent Line -->
    <path d="M 285 290 
             L 345 290 
             L 360 265 
             L 375 315 
             L 395 240 
             L 415 340 
             L 430 275 
             L 445 303 
             L 458 290 
             L 615 290" 
          fill="none" 
          stroke="#4A148C" 
          stroke-width="3.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Tube Extension to Sensor Chestpiece -->
    <path d="M 590 290
             C 610 325, 605 375, 565 410
             C 535 435, 480 435, 440 430
             L 380 430" 
          fill="none" 
          stroke="url(#lightInfinityPink)" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Acoustic Sensor Disc (Chestpiece) -->
    <g transform="translate(365, 430)">
      <!-- Outer Dial Ring -->
      <circle cx="0" cy="0" r="25" fill="none" stroke="#E91E63" stroke-width="2.5" stroke-dasharray="10 4"/>
      <!-- Metallic Bell Body -->
      <circle cx="0" cy="0" r="19" fill="#FFFFFF" stroke="url(#lightChrome)" stroke-width="3.5"/>
      <!-- Inner Acoustic Diaphragm Core -->
      <circle cx="0" cy="0" r="10" fill="#F06292"/>
      <circle cx="0" cy="0" r="5" fill="#AD1457"/>
    </g>

    <!-- Star / Lens Highlights -->
    <g fill="#FFFFFF">
      <circle cx="450" cy="188" r="3"/>
      <circle cx="310" cy="290" r="3"/>
      <circle cx="590" cy="290" r="3"/>
      <circle cx="395" cy="240" r="2.5" fill="#F8BBD0"/>
      <!-- Sparkle cross on crossing apex -->
      <path d="M 450 275 Q 450 285 460 285 Q 450 285 450 295 Q 450 285 440 285 Q 450 285 450 275 Z" fill="#FFFFFF" opacity="0.95"/>
    </g>

  </g>

  <!-- Clean Modern Light Mode Typography -->
  <g text-anchor="middle">
    <!-- Brand Title -->
    <text x="450" y="555" 
          font-family="'Montserrat', 'Rajdhani', 'Segoe UI', system-ui, sans-serif" 
          font-size="50" 
          font-weight="900" 
          letter-spacing="14" 
          fill="url(#brandTextLight)">
      SANJEEVANI
    </text>

    <!-- Subtitle / Mission Tagline -->
    <text x="450" y="594" 
          font-family="'Montserrat', 'Rajdhani', 'Segoe UI', system-ui, sans-serif" 
          font-size="13" 
          font-weight="700" 
          letter-spacing="8" 
          fill="#880E4F" 
          opacity="0.85">
      INTELLIGENT CLINICAL PLATFORM
    </text>

    <!-- Modern Clinical Cross / Baseline Accent -->
    <g transform="translate(450, 620)" stroke="#D81B60" stroke-width="1.8" opacity="0.75">
      <line x1="-28" y1="0" x2="28" y2="0"/>
      <line x1="0" y1="-5" x2="0" y2="5"/>
      <circle cx="0" cy="0" r="2.5" fill="#AD1457"/>
    </g>
  </g>
</svg>
