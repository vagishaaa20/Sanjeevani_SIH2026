name: CI

on:
  push:
    branches: [main, vagisha]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sanjeevani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        # Using `npm install` instead of `npm ci`:
        # The lockfile is generated on Windows, which omits Linux-only optional packages
        # (@emnapi/core, @emnapi/wasi-threads etc.) from the @unrs/resolver Jest toolchain.
        # `npm ci` validates the full lockfile before installing and hard-fails on this drift.
        # The drift is in devDependency/test tooling only — not production runtime code.
        # TODO: Regenerate lockfile from a Linux environment (WSL/Docker) to restore `npm ci`.
        run: npm install

      - name: Run migrations against test DB
        working-directory: ./backend
        run: npx sequelize-cli db:migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/sanjeevani_test

      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/sanjeevani_test
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-test-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-not-for-production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BHASHINI_USER_ID: ${{ secrets.BHASHINI_USER_ID }}
          BHASHINI_API_KEY: ${{ secrets.BHASHINI_API_KEY }}

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build (catches broken imports/syntax)
        working-directory: ./frontend
        run: npm run build

  contracts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package.json
      - name: Install contract dependencies
        working-directory: ./contracts
        run: npm install
      - name: Compile contracts
        working-directory: ./contracts
        run: npx hardhat compile
        continue-on-error: true
      - name: Run contract tests
        working-directory: ./contracts
        run: npx hardhat test
        continue-on-error: true